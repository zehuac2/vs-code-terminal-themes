name: Create Release Assets

on:
  release:
    types: [published]

jobs:
  upload-generated-profiles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Type check
        run: bun check

      - name: Run tests
        run: bun test

      - name: Generate profiles
        run: bun run build

      - name: Zip generated profile folders
        run: |
          cd generated
          zip -r iTerm.zip iTerm
          zip -r Warp.zip Warp
          zip -r Ghostty.zip Ghostty

      - name: Upload zipped profiles to release
        uses: softprops/action-gh-release@v3.0.1
        with:
          files: |
            generated/iTerm.zip
            generated/Warp.zip
            generated/Ghostty.zip
          fail_on_unmatched_files: true

      - name: Delete assets from older releases
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const currentTag = context.payload.release.tag_name;
            const { owner, repo } = context.repo;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            const sorted = [...releases].sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at),
            );

            // Keep the last 2 releases so installers don't throw errors if the
            // the latest release is too new.
            const keepTags = new Set([
              currentTag,
              ...sorted.map((r) => r.tag_name).filter((t) => t !== currentTag).slice(0, 2),
            ]);

            for (const release of releases) {
              if (keepTags.has(release.tag_name)) continue;

              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner,
                repo,
                release_id: release.id,
                per_page: 100,
              });

              for (const asset of assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            }
