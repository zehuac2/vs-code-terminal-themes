name: Release Generated Profiles

on:
  release:
    types: [published]

jobs:
  upload-generated-profiles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Type check
        run: bun check

      - name: Run tests
        run: bun test

      - name: Generate profiles
        run: bun run build

      - name: Upload profiles to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            generated/*.itermcolors
            generated/*.yaml
          fail_on_unmatched_files: true
