name: Release Generated Profiles

on:
  release:
    types: [published]

jobs:
  upload-generated-profiles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Type check
        run: bun check

      - name: Run tests
        run: bun test

      - name: Generate profiles
        run: bun run build

      - name: Zip generated profile folders
        run: |
          cd generated
          zip -r iTerm.zip iTerm
          zip -r Warp.zip Warp
          zip -r Ghostty.zip Ghostty

      - name: Upload zipped profiles to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            generated/iTerm.zip
            generated/Warp.zip
            generated/Ghostty.zip
          fail_on_unmatched_files: true
